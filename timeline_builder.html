<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google 地圖時間軸 (Timeline) 復原與產生工具</title>
  <!-- ExifReader CDN: 支援 HEIC/JPG 照片 EXIF 解析 -->
  <script src="https://cdn.jsdelivr.net/npm/exifreader@4.44.0/dist/exif-reader.min.js"></script>
  <!-- Leaflet CSS & JS: 免費開源互動式地圖 -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --border-color: #333;
      --accent-color: #4da6ff;
      --text-color: #e0e0e0;
      --text-muted: #aaa;
      --visit-color: #4caf50;
      --activity-color: #ff9800;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: #181818;
      border-bottom: 1px solid var(--border-color);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 {
      margin: 0;
      font-size: 1.2rem;
      color: var(--accent-color);
    }
    .header-btns button {
      background: var(--accent-color);
      color: #000;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      margin-left: 8px;
    }
    .main-container {
      display: flex;
      flex: 1;
      height: calc(100vh - 57px);
      overflow: hidden;
    }
    .panel-left {
      width: 420px;
      background: var(--card-bg);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
    }
    .panel-right {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    #map {
      flex: 1;
      background: #222;
    }
    .drop-area {
      margin: 15px;
      padding: 20px;
      border: 2px dashed var(--accent-color);
      border-radius: 8px;
      text-align: center;
      background: rgba(77, 166, 255, 0.05);
      cursor: pointer;
      transition: background 0.2s;
    }
    .drop-area:hover {
      background: rgba(77, 166, 255, 0.15);
    }
    .timeline-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 15px 15px 15px;
    }
    .timeline-item {
      background: #282828;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 12px;
      border-left: 4px solid #888;
      position: relative;
    }
    .timeline-item.visit { border-left-color: var(--visit-color); }
    .timeline-item.activity { border-left-color: var(--activity-color); }
    
    .item-header {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      margin-bottom: 8px;
      font-size: 0.9rem;
    }
    .type-visit { color: var(--visit-color); }
    .type-activity { color: var(--activity-color); }
    
    .form-group {
      margin-bottom: 8px;
      display: flex;
      align-items: center;
    }
    .form-group label {
      width: 70px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .form-group input, .form-group select {
      flex: 1;
      background: #181818;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.85rem;
    }
    .btn-delete {
      position: absolute;
      right: 10px;
      top: 10px;
      background: none;
      border: none;
      color: #ff5252;
      cursor: pointer;
      font-weight: bold;
    }
    .controls {
      padding: 10px 15px;
      display: flex;
      gap: 10px;
    }
    .btn-secondary {
      flex: 1;
      background: #333;
      color: #fff;
      border: 1px solid #555;
      padding: 8px;
      border-radius: 4px;
      cursor: pointer;
    }
    .json-preview {
      height: 200px;
      background: #151515;
      border-top: 1px solid var(--border-color);
      padding: 10px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 0.8rem;
      color: #00ff66;
    }
    .header-btns {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .header-btns button, .btn-link {
      margin-left: 0;
    }
    .btn-link {
      display: inline-block;
      background: transparent;
      color: var(--accent-color);
      border: 1px solid var(--accent-color);
      padding: 8px 16px;
      border-radius: 4px;
      font-weight: bold;
      text-decoration: none;
      font-size: 0.85rem;
    }
    .upload-hint {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .download-cta {
      display: none;
      margin: 0 15px 15px 15px;
      padding: 12px;
      background: rgba(76, 175, 80, 0.1);
      border: 1px solid var(--visit-color);
      border-radius: 8px;
      text-align: center;
    }
    .download-cta.show { display: block; }
    .download-cta p {
      margin: 0 0 8px 0;
      color: var(--visit-color);
      font-size: 0.85rem;
      font-weight: bold;
    }
    .btn-download {
      width: 100%;
      background: var(--visit-color);
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.9rem;
    }

    @media (max-width: 768px) {
      body { height: auto; min-height: 100vh; overflow: auto; }
      header { flex-wrap: wrap; padding: 10px 12px; }
      header h1 { font-size: 1rem; width: 100%; }
      .header-btns { width: 100%; }
      .header-btns button, .btn-link { flex: 1; text-align: center; padding: 10px 6px; font-size: 0.8rem; }
      .main-container { flex-direction: column; height: auto; overflow: visible; }
      .panel-left { width: 100%; border-right: none; border-bottom: 1px solid var(--border-color); }
      .panel-right { min-height: 70vh; }
      #map { height: 40vh; flex: none; }
      .timeline-list { max-height: 50vh; }
      .json-preview { height: 140px; }
      .form-group label { width: 60px; font-size: 0.75rem; }
      .controls { flex-direction: column; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Google 時間軸 (Timeline) 復原生成器</h1>
    <div class="header-btns">
      <button onclick="exportJSON()">匯出 Google Timeline JSON</button>
      <a class="btn-link" href="https://ahn-lab.org/google-timeline-visualizer/" target="_blank" rel="noopener noreferrer">🌐 用 Timeline Visualizer 檢視</a>
    </div>
  </header>

  <div class="main-container">
    <div class="panel-left">
      <div class="drop-area" onclick="document.getElementById('fileInput').click()">
        <div><strong>批次拖入 iPhone 照片 (JPG / HEIC)</strong></div>
        <div style="font-size: 0.8rem; color: var(--text-muted); margin-top: 4px;">自動讀取照片 EXIF 中的 GPS 與時間</div>
        <div class="upload-hint">單次最多上傳 <span id="maxPhotosLabel"></span> 張(已優化為平行讀取,速度更快)</div>
        <div class="upload-hint" id="uploadStatus" style="display:none; color:var(--accent-color); font-weight:600;"></div>
        <input type="file" id="fileInput" multiple accept="image/*,.heic" style="display:none">
      </div>

      <div class="controls">
        <button class="btn-secondary" onclick="addManualItem('visit')">+ 手動新增停留 (Visit)</button>
        <button class="btn-secondary" onclick="addManualItem('activity')">+ 手動新增移動 (Activity)</button>
      </div>

      <div class="download-cta" id="downloadCta">
        <p id="downloadCtaText">✅ 已產生時間軸紀錄</p>
        <button class="btn-download" onclick="exportJSON()">⬇ 下載 Google Timeline JSON</button>
      </div>

      <div class="timeline-list" id="timelineList">
        <!-- 時間軸項目 -->
      </div>
    </div>

    <div class="panel-right">
      <div id="map"></div>
      <div class="json-preview">
        <pre id="jsonCode">// 即時輸出的 Google Timeline 格式 JSON 將顯示於此...</pre>
      </div>
    </div>
  </div>

  <script>
    let timelineData = [];
    let map, markersGroup;
    const MAX_PHOTOS = 60;

    // 初始化 Leaflet 地圖
    window.onload = function() {
      map = L.map('map').setView([25.01, 121.60], 12);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);
      markersGroup = L.layerGroup().addTo(map);

      document.getElementById('maxPhotosLabel').textContent = MAX_PHOTOS;
      document.getElementById('fileInput').addEventListener('change', handlePhotos);
    };

    // 讀取單張照片的 EXIF GPS/時間;length:'auto' 只讀取包含 metadata 的檔案片段,不必載入整張照片
    // (依官方文件,length:'auto' 必須搭配 expanded + includeOffsets 使用;excludeTags.mpf 可避開內嵌預覽圖拖慢讀取)
    async function readPhotoItem(file) {
      try {
        const tags = await ExifReader.load(file, {
          length: 'auto',
          expanded: true,
          includeOffsets: true,
          excludeTags: { mpf: true }
        });
        const gps = tags.gps;
        if (gps && typeof gps.Latitude === 'number' && typeof gps.Longitude === 'number') {
          let timeStr = new Date().toISOString();
          const dateTimeOriginal = tags.exif && tags.exif.DateTimeOriginal;

          if (dateTimeOriginal) {
            // 解析 EXIF 時間 格式: YYYY:MM:DD HH:MM:SS
            const parts = dateTimeOriginal.description.split(' ');
            const d = parts[0].replace(/:/g, '-');
            timeStr = `${d}T${parts[1]}+08:00`;
          }

          return {
            type: 'visit',
            startTime: timeStr,
            endTime: timeStr,
            lat: gps.Latitude.toFixed(6),
            lng: gps.Longitude.toFixed(6),
            placeName: file.name
          };
        }
      } catch (err) {
        console.error("無法讀取 EXIF:", file.name, err);
      }
      return null;
    }

    // 處理上傳照片:平行讀取每張照片的 EXIF,大幅縮短多張照片的等待時間
    async function handlePhotos(e) {
      let files = Array.from(e.target.files);
      if (files.length > MAX_PHOTOS) {
        alert(`一次最多可上傳 ${MAX_PHOTOS} 張照片。您選擇了 ${files.length} 張,僅會處理前 ${MAX_PHOTOS} 張。`);
        files = files.slice(0, MAX_PHOTOS);
      }
      e.target.value = '';

      const statusEl = document.getElementById('uploadStatus');
      let done = 0;
      statusEl.style.display = 'block';
      statusEl.textContent = `解析中… 0 / ${files.length}`;

      const results = await Promise.all(files.map(file => readPhotoItem(file).then(item => {
        done++;
        statusEl.textContent = `解析中… ${done} / ${files.length}`;
        return item;
      })));

      statusEl.style.display = 'none';
      let newItems = results.filter(Boolean);

      // 按時間排序(平行處理後順序可能被打亂,排序後才補上移動軌跡)
      newItems.sort((a, b) => new Date(a.startTime) - new Date(b.startTime));
      
      // 自動推算前後移動軌跡
      for (let i = 0; i < newItems.length; i++) {
        timelineData.push(newItems[i]);
        if (i < newItems.length - 1) {
          // 自動補上點與點之間的移動 Segment
          timelineData.push({
            type: 'activity',
            startTime: newItems[i].endTime,
            endTime: newItems[i+1].startTime,
            startLat: newItems[i].lat,
            startLng: newItems[i].lng,
            endLat: newItems[i+1].lat,
            endLng: newItems[i+1].lng,
            activityType: 'motorcycling'
          });
        }
      }

      renderTimeline();
    }

    function addManualItem(type) {
      const now = new Date();
      const isoNow = now.toISOString().substring(0, 16);
      if (type === 'visit') {
        timelineData.push({
          type: 'visit',
          startTime: `${isoNow}:00.000+08:00`,
          endTime: `${isoNow}:00.000+08:00`,
          lat: '25.002193',
          lng: '121.615984',
          placeName: '自訂地點'
        });
      } else {
        timelineData.push({
          type: 'activity',
          startTime: `${isoNow}:00.000+08:00`,
          endTime: `${isoNow}:00.000+08:00`,
          startLat: '25.002193',
          startLng: '121.615984',
          endLat: '25.010228',
          endLng: '121.625489',
          activityType: 'motorcycling'
        });
      }
      renderTimeline();
    }

    function removeItem(index) {
      timelineData.splice(index, 1);
      renderTimeline();
    }

    function renderTimeline() {
      const listContainer = document.getElementById('timelineList');
      listContainer.innerHTML = '';
      markersGroup.clearLayers();

      let latLngs = [];

      timelineData.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = `timeline-item ${item.type}`;
        
        if (item.type === 'visit') {
          div.innerHTML = `
            <button class="btn-delete" onclick="removeItem(${index})">✕</button>
            <div class="item-header"><span class="type-visit">📍 地點停留 (Visit)</span></div>
            <div class="form-group"><label>開始時間</label><input type="text" value="${item.startTime}" onchange="timelineData[${index}].startTime=this.value; updatePreview();"></div>
            <div class="form-group"><label>結束時間</label><input type="text" value="${item.endTime}" onchange="timelineData[${index}].endTime=this.value; updatePreview();"></div>
            <div class="form-group"><label>經緯度</label><input type="text" value="${item.lat}, ${item.lng}" onchange="updateCoords(${index}, this.value); updatePreview();"></div>
          `;
          const marker = L.marker([item.lat, item.lng]).bindPopup(`停留點: ${item.lat}, ${item.lng}`);
          markersGroup.addLayer(marker);
          latLngs.push([item.lat, item.lng]);

        } else {
          div.innerHTML = `
            <button class="btn-delete" onclick="removeItem(${index})">✕</button>
            <div class="item-header"><span class="type-activity">🏍️ 移動行程 (Activity)</span></div>
            <div class="form-group"><label>開始時間</label><input type="text" value="${item.startTime}" onchange="timelineData[${index}].startTime=this.value; updatePreview();"></div>
            <div class="form-group"><label>結束時間</label><input type="text" value="${item.endTime}" onchange="timelineData[${index}].endTime=this.value; updatePreview();"></div>
            <div class="form-group">
              <label>交通方式</label>
              <select onchange="timelineData[${index}].activityType=this.value; updatePreview();">
                <option value="motorcycling" ${item.activityType === 'motorcycling' ? 'selected' : ''}>機車 (Motorcycling)</option>
                <option value="walking" ${item.activityType === 'walking' ? 'selected' : ''}>步行 (Walking)</option>
                <option value="passenger_vehicle" ${item.activityType === 'passenger_vehicle' ? 'selected' : ''}>汽車 (Drive)</option>
                <option value="cycling" ${item.activityType === 'cycling' ? 'selected' : ''}>單車 (Cycling)</option>
              </select>
            </div>
          `;
          const polyline = L.polyline([[item.startLat, item.startLng], [item.endLat, item.endLng]], {color: 'orange'}).addTo(markersGroup);
        }

        listContainer.appendChild(div);
      });

      if (latLngs.length > 0) {
        map.fitBounds(L.latLngBounds(latLngs));
      }

      const cta = document.getElementById('downloadCta');
      const ctaText = document.getElementById('downloadCtaText');
      if (timelineData.length > 0) {
        cta.classList.add('show');
        ctaText.textContent = `✅ 已產生 ${timelineData.length} 筆時間軸紀錄,可下載 JSON`;
      } else {
        cta.classList.remove('show');
      }

      updatePreview();
    }

    // Haversine 公式計算兩點間距離(公尺),用於 activity.distanceMeters
    function haversineMeters(lat1, lng1, lat2, lng2) {
      const R = 6371000;
      const toRad = deg => deg * Math.PI / 180;
      const dLat = toRad(lat2 - lat1);
      const dLng = toRad(lng2 - lng1);
      const a = Math.sin(dLat / 2) ** 2 +
                Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    // 從 ISO 時間字串解析 UTC 偏移分鐘數(Google Timeline 官方格式所需欄位)
    function getUtcOffsetMinutes(isoString) {
      if (/z$/i.test(isoString)) return 0;
      const match = /([+-])(\d{2}):?(\d{2})$/.exec(isoString);
      if (!match) return 0;
      const sign = match[1] === '-' ? -1 : 1;
      return sign * (parseInt(match[2], 10) * 60 + parseInt(match[3], 10));
    }

    function updateCoords(index, val) {
      const parts = val.split(',');
      if (parts.length === 2) {
        timelineData[index].lat = parts[0].trim();
        timelineData[index].lng = parts[1].trim();
      }
    }

    function generateGoogleJSON() {
      const semanticSegments = timelineData.map(item => {
        const base = {
          startTime: item.startTime,
          endTime: item.endTime,
          startTimeTimezoneUtcOffsetMinutes: getUtcOffsetMinutes(item.startTime),
          endTimeTimezoneUtcOffsetMinutes: getUtcOffsetMinutes(item.endTime)
        };
        if (item.type === 'visit') {
          return {
            ...base,
            visit: {
              hierarchyLevel: 0,
              probability: 0.9,
              topCandidate: {
                placeId: "CustomPlaceID",
                semanticType: "Unknown",
                probability: 0.85,
                placeLocation: `geo:${item.lat},${item.lng}`
              }
            }
          };
        } else {
          return {
            ...base,
            activity: {
              start: `geo:${item.startLat},${item.startLng}`,
              end: `geo:${item.endLat},${item.endLng}`,
              distanceMeters: Math.round(haversineMeters(
                parseFloat(item.startLat), parseFloat(item.startLng),
                parseFloat(item.endLat), parseFloat(item.endLng)
              )),
              probability: 0.85,
              topCandidate: {
                type: item.activityType,
                probability: 0.8
              }
            }
          };
        }
      });
      return { semanticSegments };
    }

    function updatePreview() {
      const json = generateGoogleJSON();
      document.getElementById('jsonCode').textContent = JSON.stringify(json, null, 2);
    }

    function exportJSON() {
      const json = generateGoogleJSON();
      const blob = new Blob([JSON.stringify(json, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `timeline_export_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
    }
  </script>
</body>
</html>
